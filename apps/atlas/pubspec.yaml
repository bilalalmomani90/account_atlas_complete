name: atlas
description: Account Atlas app (Android + Windows).
publish_to: none
version: 0.1.0+1   # versionName 0.1.0, versionCode 1 -> must increase every release
environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  atlas_core:
    path: ../../packages/atlas_core
  drift: ^2.35.0
  path: ^1.9.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0  # TODO(verify): version + saveFile behaviour on Android/Windows
  flutter_secure_storage: ^9.2.0  # TODO(verify): Windows backend + current version
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
